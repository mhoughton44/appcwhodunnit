<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Stole the Answer Key? AP Precalc Review</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#17141f;--card:#241f31;--ink:#efeaf7;--mute:#a79fba;--acc:#ffc857;--bad:#ff7a7a;--ok:#7be0a0;--line:#383048;--btnink:#2a1d00}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f0fa;--card:#fff;--ink:#241c33;--mute:#645a78;--acc:#8a5a00;--bad:#c62828;--ok:#1b7a43;--line:#d9d0e8;--btnink:#fff}}
:root[data-theme="light"]{--bg:#f4f0fa;--card:#fff;--ink:#241c33;--mute:#645a78;--acc:#8a5a00;--bad:#c62828;--ok:#1b7a43;--line:#d9d0e8;--btnink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.2rem;margin:.2em 0 .5em;color:var(--acc)}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-family:system-ui,sans-serif;font-weight:600;color:var(--mute);background:transparent}
.tab.on{border-color:var(--acc);color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sus{cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);text-align:left;font:inherit}
.sus.out{opacity:.4;text-decoration:line-through;border-style:dashed}
.sus small{display:block;color:var(--mute);font-family:system-ui,sans-serif}
.q{padding:10px 0;border-top:1px solid var(--line);font-family:system-ui,sans-serif}.q:first-of-type{border-top:0}
.q b{color:var(--acc)}.q small{display:block;color:var(--mute)}
input,select{width:100%;margin-top:6px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
button.go{background:var(--acc);color:var(--btnink);border:0;border-radius:8px;padding:12px 18px;font:700 16px system-ui,sans-serif;cursor:pointer}
button.link{background:none;border:0;color:var(--mute);cursor:pointer;font:14px system-ui,sans-serif;padding:0;text-decoration:underline}
.msg{margin:10px 0;font-weight:700;font-family:system-ui,sans-serif}.bad{color:var(--bad)}.good{color:var(--ok)}
.tag{color:var(--mute);font-size:.85rem;font-family:system-ui,sans-serif}
.quote{border-left:4px solid var(--acc);padding-left:12px;font-style:italic}
.wit{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
<h1>🕵️ Who Stole the Answer Key?</h1>
<p class="tag">The quiz answer key vanished from the math office. Five witnesses saw something, but each will only talk to someone who solves their problems. Split up, interview, then pool your clues.</p>
<div class="tabs"><button class="tab on" id="t1" onclick="tab(1)">Witnesses</button><button class="tab" id="t2" onclick="tab(2)">Case Board</button></div>
<div id="view"></div>
</main>
<script>
var SUS=[
{n:"Mr. Asymptote",a:"glasses",c:"blue",i:"coffee"},
{n:"Ms. Logarithm",a:"hat",c:"red",i:"laptop"},
{n:"Dr. Domain",a:"glasses",c:"green",i:"laptop"},
{n:"Prof. Parabola",a:"hat",c:"blue",i:"umbrella"},
{n:"Coach Residual",a:"scarf",c:"red",i:"coffee"}];
var CULPRIT="Mr. Asymptote";
var W=[
{n:"The Janitor",e:"🧹",clue:"“I was mopping the hall. Whoever it was wasn’t carrying an umbrella.”",qs:[
{p:"#1: Find the size of the error in the exponential model for 2013, in dollars (t = years since 2000).",hint:"Use your calculator’s exponential regression. Round to three decimals, and enter the error as a positive number.",type:"num",ans:0.03,tol:0.0016,abs:true},
{p:"#1: Is the model’s 2013 value an underestimate or an overestimate?",type:"mc",opts:["Underestimate","Overestimate"],ans:"Overestimate"},
{p:"#2: Write f(x) = a(b^x) + k for the table.",hint:"Type like 2(5^x)+1",type:"txt",ans:["4^x+2","14^x+2","1*4^x+2","(4^x)+2","2+4^x","(4)^x+2"]},
{p:"#3: Is the exponential model appropriate, based on the residual plot?",type:"mc",opts:["Appropriate: the residuals are scattered with no clear pattern","Not appropriate: the residuals show a clear curved pattern","Not appropriate: there are too many points above the line"],ans:"Appropriate: the residuals are scattered with no clear pattern"}]},
{n:"The Librarian",e:"📚",clue:"“I’d have noticed a scarf. This person wasn’t wearing one.”",qs:[
{p:"#9: Which choice is equivalent to g(x) = 25·49^x?",type:"mc",opts:["A","B","C","D"],ans:"C"},
{p:"#10: Which statement is true?",type:"mc",opts:["A","B","C","D"],ans:"D"},
{p:"#11: Which expression is g(f(x))?",type:"mc",opts:["A","B","C","D"],ans:"D"},
{p:"#12: Which could be k(x)?",type:"mc",opts:["A","B","C","D"],ans:"C"},
{p:"#13: Which could represent Z?",type:"mc",opts:["A","B","C","D"],ans:"D"}]},
{n:"The Student Aide",e:"🎒",clue:"“They definitely weren’t dressed in green.”",qs:[
{p:"#4a: g(f(4))",type:"num",ans:10},
{p:"#4b: (f ∘ g)(0)",type:"num",ans:9},
{p:"#5a: f(g(−1))",type:"num",ans:160},
{p:"#5b: (g ∘ f)(1)",type:"num",ans:8},
{p:"#5c: f(g(x)), fully expanded",hint:"Type like 3x^2-4x+1",type:"txt",ans:["27x^2-78x+55","55-78x+27x^2"]}]},
{n:"The Security Guard",e:"🔦",clue:"“On the camera I saw no hat. Not a single one.”",qs:[
{p:"#6a: f(g(1))",type:"num",ans:3},
{p:"#6b: f(g(−3))",type:"num",ans:3},
{p:"#6c: g(f(2))",type:"num",ans:-2},
{p:"#6d: f(f⁻¹(1))",type:"num",ans:1},
{p:"#6e: f(g⁻¹(−1))",hint:"Decimal to three places or a fraction",type:"num",ans:0.5},
{p:"#6f: The domain of f⁻¹(x)",hint:"Interval notation, like [1,4]",type:"txt",ans:["[0.5,3]","[1/2,3]","0.5<=x<=3","1/2<=x<=3"]}]},
{n:"The Custodian",e:"🗝️",clue:"“I saw glasses, and their fingers smelled like coffee. That’s all I’ve got.”",qs:[
{p:"#7: Find f⁻¹(x) for f(x) = (x − 2)² + 1, x ≤ 2",hint:"Type like 3-sqrt(x+5)",type:"txt",ans:["2-sqrt(x-1)","-sqrt(x-1)+2"]},
{p:"#7: Domain of f⁻¹(x)",hint:"Use ∞ or inf for infinity",type:"txt",ans:["x>=1","[1,inf)","[1,infinity)"]},
{p:"#7: Range of f⁻¹(x)",type:"txt",ans:["y<=2","x<=2","(-inf,2]","(-infinity,2]"]},
{p:"#8: Find the inverse of m(x) = (2x + 1)/(3x − 4)",hint:"Type like (2x+3)/(x-1)",type:"txt",ans:["(4x+1)/(3x-2)"]}]}
];
var heard={},out={},open=-1,tries=0,solved=false,mode=1;
var $=function(i){return document.getElementById(i)};
function norm(s){return String(s).toLowerCase().replace(/[−–]/g,"-").replace(/[·×*\s]/g,"").replace(/²/g,"^2").replace(/√/g,"sqrt").replace(/∞/g,"inf").replace(/≥/g,">=").replace(/≤/g,"<=").replace(/^[a-z]\^?-?1?\(x\)=|^y=/,"")}
function num(s){s=String(s).replace(/−/g,"-").trim();if(s.indexOf("/")>0){var a=s.split("/");return parseFloat(a[0])/parseFloat(a[1])}return parseFloat(s)}
function ok(q,v){
if(!v)return false;
if(q.type==="mc")return v===q.ans;
if(q.type==="num"){var n=num(v);if(isNaN(n))return false;if(q.abs)n=Math.abs(n);return Math.abs(n-q.ans)<=(q.tol||1e-6)}
return q.ans.indexOf(norm(v))>-1}
function tab(m){mode=m;open=-1;$("t1").className="tab"+(m==1?" on":"");$("t2").className="tab"+(m==2?" on":"");draw()}
function draw(){mode==1?witnesses():board()}
function witnesses(){
if(open>=0){return room(open)}
var h='<p class="tag">Tip for groups: each person takes a different witness, then meet up to share clues. Count of witnesses heard on this device: '+Object.keys(heard).length+' of '+W.length+'.</p>';
W.forEach(function(w,i){
h+='<div class="card"><div class="wit"><div><b>'+w.e+' '+w.n+'</b><div class="tag">'+w.qs.length+' problems</div></div>'+
(heard[i]?'<span class="good">✔ Interviewed</span>':'<button class="go" onclick="openRoom('+i+')">Interview</button>')+'</div>'+
(heard[i]?'<p class="quote">'+w.clue+'</p>':'')+'</div>'});
$("view").innerHTML=h}
function openRoom(i){open=i;draw();window.scrollTo(0,0)}
function room(i){
var w=W[i],h='<div class="card"><h2>'+w.e+' Interviewing '+w.n+'</h2><p class="tag">Answer every problem correctly and this witness will talk. Use your review packet.</p>';
w.qs.forEach(function(q,j){
h+='<div class="q"><b>'+(j+1)+'.</b> '+q.p+(q.hint?'<small>'+q.hint+'</small>':'');
h+=q.type==="mc"?'<select id="a'+j+'"><option value="">Choose…</option>'+q.opts.map(function(o){return '<option>'+o+'</option>'}).join("")+'</select>':'<input id="a'+j+'" autocomplete="off" autocapitalize="off" spellcheck="false">';
h+='</div>'});
h+='<button class="go" onclick="tryRoom('+i+')">Ask for the testimony</button> <button class="link" onclick="open=-1;draw()">Back</button><div class="msg" id="msg"></div></div>';
$("view").innerHTML=h}
function tryRoom(i){
var w=W[i],c=0;
w.qs.forEach(function(q,j){if(ok(q,$("a"+j).value))c++});
if(c===w.qs.length){heard[i]=true;open=-1;draw();window.scrollTo(0,0)}
else{$("msg").className="msg bad";$("msg").textContent="“I’m not saying a word yet.” "+c+" of "+w.qs.length+" answers are correct. Recheck your work."}}
function board(){
var h='<p class="tag">Click a suspect to cross them off when a clue rules them out. Clues you’ve earned on this device are listed below.</p><div class="grid">';
SUS.forEach(function(s,i){h+='<button class="sus'+(out[i]?" out":"")+'" onclick="out['+i+']=!out['+i+'];board()"><b>'+s.n+'</b><small>Wears: '+s.a+', '+s.c+'</small><small>Carries: '+s.i+'</small></button>'});
h+='</div><div class="card"><h2>Testimony so far</h2>';
var any=false;
W.forEach(function(w,i){if(heard[i]){any=true;h+='<p><b>'+w.e+' '+w.n+':</b> <span class="quote">'+w.clue+'</span></p>'}});
if(!any)h+='<p class="tag">Nothing yet. Interview a witness first, or find a teammate who has.</p>';
h+='</div>';
if(solved){h+='<div class="card"><h2 class="good">🎉 Case closed!</h2><p>It was <b>'+CULPRIT+'</b>. Wrong accusations on this device: '+tries+'. Show your teacher this screen.</p></div>'}
else{h+='<div class="card"><h2>Make your accusation</h2><select id="acc"><option value="">Choose a suspect…</option>'+SUS.map(function(s){return '<option>'+s.n+'</option>'}).join("")+'</select><div style="margin-top:10px"><button class="go" onclick="accuse()">Accuse</button></div><div class="msg" id="amsg"></div></div>'}
$("view").innerHTML=h}
function accuse(){
var v=$("acc").value;if(!v)return;
if(v===CULPRIT){solved=true;board()}
else{tries++;$("amsg").className="msg bad";$("amsg").textContent="Not the right person. Pool more testimony, then try again. Wrong accusations: "+tries}}
draw();
</script>
</body>
</html>
